name: Sync rule formats

on:
  push:
    paths:
      - 'rule/Surge/*.list'
      - 'rule/convert.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert Surge rules to Loon and Quantumult X
        run: python3 rule/convert.py

      - name: Validate output
        run: |
          python3 - <<'PY'
          import glob, re
          for p in glob.glob('rule/Qx/*.list'):
              bad = [l for l in open(p) if l.strip() and not l.startswith('#')
                     and not re.match(r'^[A-Za-z0-9-]+,\s*[^,]+,\s*\S', l)]
              if bad:
                  print('invalid in', p, bad[:3])
                  raise SystemExit(1)
          print('ok')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rule/Loon rule/Qx
          if git diff --cached --quiet; then
            echo 'No format changes'
            exit 0
          fi
          git commit -m '同步 Loon 与 Quantumult X 规则'
          git push
