name: Lint rules

on:
  push:
    paths:
      - 'rule/**'
      - 'tools/lint_rules.py'
  pull_request:
    paths:
      - 'rule/**'
      - 'tools/lint_rules.py'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint rule files
        run: python3 tools/lint_rules.py
