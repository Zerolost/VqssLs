name: Sync airport rules

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 往回翻几页（每页 20 条）
        default: '5'
  schedule:
    - cron: '43 21 * * *'

permissions:
  contents: write

concurrency:
  group: airport-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch airports from Telegram
        env:
          PAGES: ${{ github.event.inputs.pages || '5' }}
        run: python3 -u tools/sync_telegram_airport.py --pages "$PAGES"

      - name: Generate Loon and Quantumult X rules
        run: python3 rule/convert.py

      - name: Lint rules
        run: python3 tools/lint_rules.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rule/Surge/Airport.list rule/Loon rule/Qx rule/.airport-state.json rule/airport-closed.txt
          if git diff --cached --quiet; then
            echo 'No new airports'
            exit 0
          fi
          added=$(git diff --cached --numstat -- rule/Surge/Airport.list | awk '{print $1}')
          git commit -m "同步机场规则（Airport.list +${added} 行）"
          git push
